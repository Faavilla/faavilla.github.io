<header class="layout-container header">
  <div class="header__row">
    <h1 class="header__brand"><a href="{{ `/` | relURL }}">{{ site.Title }}</a></h1>

    <div class="header__actions">
      <a class="header__link" href="https://github.com/Faavilla" target="_blank" rel="noopener noreferrer" aria-label="GitHub (새 탭에서 열림)">GitHub</a>
      <button type="button" class="color-mode-btn" aria-label="다크 모드"></button>
    </div>
  </div>

  <div class="header__line" aria-hidden="true"></div>
</header>

{{ $colorModeJS := resources.Get "js/color-mode-btn.js" | minify | fingerprint }}
<script src="{{ $colorModeJS.RelPermalink }}" defer></script>
