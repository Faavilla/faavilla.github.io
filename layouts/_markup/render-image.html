{{- /* Lazy loading for all images; size only for bundle images Hugo can measure (not SVG) */ -}}
{{- $img := .Page.Resources.Get (strings.TrimPrefix "./" .Destination) -}}
{{- if $img -}}
<img src="{{ $img.RelPermalink }}" alt="{{ .PlainText }}"{{ if reflect.IsImageResourceWithMeta $img }} width="{{ $img.Width }}" height="{{ $img.Height }}"{{ end }} loading="lazy" decoding="async">
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy" decoding="async">
{{- end -}}
