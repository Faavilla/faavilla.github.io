<!DOCTYPE html>

<html lang="{{ site.Language.Lang }}">

  {{ partial "head.html" . }}

  <body>

    {{ partial "header.html" . }}

    <main class="layout-container article" aria-label="Main content">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{/* Back-link handler; loaded site-wide since both page and section templates render the link */}}
    {{ $backLinkJS := resources.Get "js/back-link.js" | minify | fingerprint }}
    <script src="{{ $backLinkJS.RelPermalink }}" defer></script>

  </body>

</html>
