# Builds on every push and pull request; deploys only on a push to main
name: hugo build and deploy

permissions:
  contents: write # Needed to push the built site to the publish branch

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

env:
  # Bump the checksum together with the version; a stale hash fails the build
  HUGO_VERSION: 0.165.0
  HUGO_SHA256: 6c3a37a5450b3e386e5b75a87a790fea2d04a796d75e171216c80ef48a32b432
  DART_SASS_VERSION: 1.102.0
  DART_SASS_SHA256: 3a2ce6036f94534b39356252b1a3d4aa7879ab139c73bf62f7c9b5beafcfc367
  HUGO_ENVIRONMENT: production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # The deploy step authenticates on its own

      # Standard edition is enough: WebP went all-edition in v0.153.0 and Dart Sass is an external binary
      - name: Install Hugo and Dart Sass
        run: |
          set -e # A failed checksum exits non-zero and stops the build here
          mkdir -p "${HOME}/.local/bin"

          # Download, verify, then extract: piping straight to tar leaves no place to check
          # sha256sum -c needs exactly two spaces between the hash and the filename
          curl -sfLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -C "${HOME}/.local/bin" hugo

          curl -sfLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" -C "${HOME}/.local"

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

          # Absolute paths: GITHUB_PATH only takes effect in later steps
          echo "Hugo      : $("${HOME}/.local/bin/hugo" version)"
          echo "Dart Sass : $("${HOME}/.local/dart-sass/sass" --version)"

      - name: Build Hugo site
        run: hugo --gc --minify # baseURL comes from config/_default/hugo.toml

      # A fresh git init inside public/ leaves the branch at exactly one commit, so no history piles up
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch public/.nojekyll
          cd public
          git init -b github-pages
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" github-pages
